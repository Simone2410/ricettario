<h1>{{ i18n.t().favorites.title }}</h1>
<p class="page-intro">{{ i18n.t().favorites.intro }}</p>

@if (recipeService.favorites().length > 0) {
  <div class="recipe-grid">
    @for (recipe of recipeService.favorites(); track recipe.id) {
      <app-recipe-card [recipe]="recipe" />
    }
  </div>
} @else {
  <div class="empty-state">
    <p>{{ i18n.t().favorites.emptyText }}</p>
    <a class="button" routerLink="/ricette">{{ i18n.t().favorites.goToRecipes }}</a>
  </div>
}
