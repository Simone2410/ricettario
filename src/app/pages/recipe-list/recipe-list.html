<h1>{{ i18n.t().recipeList.title }}</h1>
<p class="page-intro">{{ i18n.t().recipeList.intro }}</p>

<form class="filters" (submit)="$event.preventDefault()">
  <input
    type="search"
    class="search"
    [placeholder]="i18n.t().recipeList.searchPlaceholder"
    [attr.aria-label]="i18n.t().recipeList.searchAria"
    [value]="query()"
    (input)="onQueryInput($event)"
  />

  <select [attr.aria-label]="i18n.t().recipeList.categoryAria" (change)="onCategoryChange($event)">
    <option value="" [selected]="category() === ''">{{ i18n.t().recipeList.allCategories }}</option>
    @for (item of categories(); track item.value) {
      <option [value]="item.value" [selected]="item.value === category()">{{ item.label }}</option>
    }
  </select>

  <select [attr.aria-label]="i18n.t().recipeList.difficultyAria" (change)="onDifficultyChange($event)">
    <option value="" [selected]="difficulty() === ''">{{ i18n.t().recipeList.allDifficulties }}</option>
    @for (item of difficulties(); track item.value) {
      <option [value]="item.value" [selected]="item.value === difficulty()">{{ item.label }}</option>
    }
  </select>

  @if (hasFilters()) {
    <button type="button" class="button secondary" (click)="resetFilters()">{{ i18n.t().recipeList.resetFilters }}</button>
  }
</form>

<p class="results">{{ resultsLabel() }}</p>

@if (filteredRecipes().length > 0) {
  <div class="recipe-grid">
    @for (recipe of filteredRecipes(); track recipe.id) {
      <app-recipe-card [recipe]="recipe" />
    }
  </div>
} @else {
  <div class="empty-state">
    <p>{{ i18n.t().recipeList.emptyText }}</p>
    <button type="button" class="button" (click)="resetFilters()">{{ i18n.t().recipeList.showAll }}</button>
  </div>
}
