<article class="card">
  <a class="card-link" [routerLink]="['/ricette', recipe().id]">
    <div class="card-image" [style.background]="recipe().color">
      <span class="card-emoji" aria-hidden="true">{{ recipe().emoji }}</span>
    </div>
    <div class="card-body">
      <span class="badge">{{ i18n.t().labels.categories[recipe().category] }}</span>
      <h3>{{ recipe().title }}</h3>
      <p class="description">{{ recipe().description }}</p>
      <ul class="meta">
        <li>{{ recipe().minutes }} {{ i18n.t().shared.minutes }}</li>
        <li>{{ recipe().servings }} {{ i18n.t().shared.servings }}</li>
        <li>{{ i18n.t().labels.difficulties[recipe().difficulty] }}</li>
      </ul>
    </div>
  </a>
  <button
    type="button"
    class="favorite"
    [class.active]="isFavorite()"
    [attr.aria-pressed]="isFavorite()"
    [attr.aria-label]="isFavorite() ? i18n.t().shared.removeFavorite : i18n.t().shared.addFavorite"
    (click)="toggleFavorite()"
  >
    {{ isFavorite() ? '♥' : '♡' }}
  </button>
</article>
